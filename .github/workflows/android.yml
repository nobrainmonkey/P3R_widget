name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Cache Robolectric SDK jars
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/p3r-toolchain/test-home/.m2/repository/org/robolectric
          key: robolectric-4.14.1-i7-${{ hashFiles('scripts/fetch_robolectric_jars.sh') }}
      - name: Fetch Robolectric SDK jars (with retries)
        run: scripts/fetch_robolectric_jars.sh "${{ runner.temp }}/p3r-toolchain"
      - name: Check game data
        run: |
          python3 rules/build/build_p3r_rules.py --check
          python3 -m unittest discover -s rules/build -p 'test_*.py'
          python3 scripts/validate_persona_data.py
          python3 -m unittest discover -s scripts -p 'test_persona_acquisition.py'
      - name: Unit tests and debug build
        working-directory: android
        env:
          P3R_TOOLCHAIN: ${{ runner.temp }}/p3r-toolchain
          P3R_QA_DIR: ${{ runner.temp }}/qa_out
        run: ./gradlew --no-daemon :app:testDebugUnitTest --fail-fast :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-renders
          path: ${{ runner.temp }}/qa_out
          if-no-files-found: ignore
      - name: Upload unit test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-test-reports
          path: |
            android/app/build/test-results/testDebugUnitTest/TEST-*.xml
            android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
