<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0642b7"><meta name="color-scheme" content="dark"><script id="themeBootstrap">try{document.documentElement.dataset.theme=localStorage.getItem('p3r_theme_mode_v1')==='night'?'night':'day'}catch(e){document.documentElement.dataset.theme='day'}</script><title>P3R 逐日攻略</title><style>:root {
  color-scheme: dark;
  --bg:#0642b7;
  --surface:#0b52c6;
  --surface-active:#1164db;
  --surface-deep:#093aab;
  --blue:#0b4cc5;
  --deep:#072d91;
  --navy:#062676;
  --cyan:#78f1ff;
  --aqua:#b0f9ff;
  --ink:#ffffff;
  --muted:#b7dafc;
  --line:#478ddb;
  --display:'Arial Narrow','Roboto Condensed','Helvetica Neue','Arial',sans-serif;
  --body:'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','Roboto',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  background:var(--bg);
  color:var(--ink);
  font:14px/1.55 var(--body);
  margin:0;
  padding-bottom:calc(82px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button,input{font:inherit;touch-action:manipulation}
button{cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--aqua);outline-offset:3px}
button:focus:not(:focus-visible){outline:none}
[hidden]{display:none!important}
/* Header lives in the same blue world as the rest of the screen. */
.masthead{background:#05359f;border-bottom:1px solid #4d95ef;position:relative;z-index:5}
.masthead-inner{max-width:920px;margin:0 auto;min-height:66px;padding:11px 20px;display:flex;align-items:center;gap:13px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-square{
  width:62px;height:38px;display:flex;align-items:center;justify-content:center;
  font:900 italic 32px/.9 var(--display);letter-spacing:-.12em;color:#fff;
  white-space:nowrap;transform:skew(-9deg);position:relative;
}
.brand-square:after{content:'';position:absolute;bottom:0;left:4px;right:0;height:3px;background:var(--cyan);transform:skew(-20deg)}
.brand-square span{color:var(--cyan)}
.brand-text{color:#fff;font:900 italic 13px/.9 var(--display);letter-spacing:.065em;transform:skew(-5deg)}
.mini-stat{display:flex;align-items:baseline;gap:4px;margin-left:auto;color:#fff;font:900 italic 21px/1 var(--display)}
.tinydivider{color:var(--cyan);font-weight:600}
.mini-label{color:var(--muted);font:800 9px/1 var(--display);letter-spacing:.1em;margin-left:6px}
.menu-button{height:36px;width:38px;padding:1px;border:0;color:#fff;background:transparent;font-size:22px;line-height:1;display:grid;place-items:center}
.menu-button:hover{color:var(--cyan)}
/* Flat ink-blue hero. The geometry hints at moving water without gradients or glass. */
.blue-panel{position:relative;overflow:hidden;background:#104ed0;color:#fff;isolation:isolate}
.blue-panel:before{content:'';position:absolute;inset:0 auto 0 52%;width:62%;background:#155ee0;transform:skewX(-23deg);z-index:-1;opacity:.55}
.blue-panel:after{content:'';position:absolute;top:-220px;right:-118px;height:470px;width:440px;border:2px solid #6ccdfb;border-radius:50%;transform:rotate(-26deg);opacity:.18;pointer-events:none}
.blue-panel-inner{max-width:920px;margin:auto;padding:23px 23px 29px;min-height:214px;position:relative}
.blue-panel-inner:after{content:'';position:absolute;width:260px;height:260px;right:3%;bottom:-195px;border:27px solid #6fcfff;opacity:.07;border-radius:50%;pointer-events:none}
.panel-id{font:900 11px/1 var(--display);letter-spacing:.19em;color:#dcfaff}
.panel-id span{color:var(--cyan)}
.panel-title{display:flex;align-items:center;gap:17px;margin:7px 0 6px;position:relative;z-index:1}
.huge-number{flex:none;min-width:138px;display:block;font:900 italic clamp(91px,15vw,124px)/.9 var(--display);letter-spacing:-.115em;transform:skew(-8deg);color:#fff}
.panel-right{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding-top:8px}
.panel-right strong{color:#fff;font:900 italic clamp(33px,7vw,51px)/.95 var(--display);letter-spacing:-.055em;transform:skew(-6deg)}
.panel-right span{color:#dbf7ff;letter-spacing:.14em;font-size:12px;font-weight:850}
.panel-progress{display:flex;justify-content:space-between;align-items:center;gap:10px;font:900 italic 12px/1 var(--display);letter-spacing:.07em;margin-top:6px;color:#e3f9ff}
.progress-track{height:5px;background:#3986de;margin-top:9px;transform:skew(-7deg);overflow:hidden}
.progress-track>div{height:100%;background:var(--cyan);width:0%;transition:width .33s cubic-bezier(.2,.85,.3,1)}
.panel-stripe{position:absolute;top:0;right:12%;height:19px;width:72px;background:var(--cyan);transform:skew(-32deg);opacity:.85}
/* Month selector and search remain on blue. */
.control-strip{background:#0739ac;border-top:2px solid #2e87e8;border-bottom:1px solid #3d86df}
.control-inner{max-width:920px;margin:0 auto;padding:12px 18px 15px}
.months{display:flex;align-items:center;gap:4px;padding:0 3px 13px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.months::-webkit-scrollbar{display:none}
.month-btn{flex:none;border:0;background:transparent;position:relative;min-width:49px;padding:9px 12px;color:#a1c9f5;font:900 italic 23px/1 var(--display);letter-spacing:-.025em;transform:skew(-6deg);transition:color .17s,transform .17s}
.month-btn span{position:relative;z-index:2}
.month-btn.active{color:#063b9b}
.month-btn.active:before{content:'';position:absolute;inset:1px 0;background:#f9ffff;transform:skew(-14deg);z-index:0}
.month-btn.active:after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:3px;background:var(--cyan);transform:skew(-14deg)}
.month-btn:not(.active):hover{color:#fff;transform:skew(-6deg) translateY(-2px)}
.control-row{display:flex;align-items:center;gap:15px}
.searchbox{display:flex;align-items:center;gap:8px;min-width:0;flex:1;padding:6px 3px 7px;border-bottom:2px solid #6fc6fa}
.searchbox:focus-within{border-bottom-color:var(--cyan)}
.search-icon{font-size:25px;color:#ecffff;line-height:1}
.searchbox input{display:block;background:transparent;border:0;outline:none!important;min-width:0;width:100%;font-weight:700;font-size:13px;color:#fff;padding:0}
.searchbox input::placeholder{color:#aed8f9;font-weight:500;opacity:1}
.searchbox input::-webkit-search-cancel-button{filter:invert(1)}
.pending-btn{border:1px solid #74c9f5;background:transparent;color:#fff;font-size:12px;font-weight:850;padding:9px 12px;white-space:nowrap;transition:background .16s, color .16s;transform:skew(-7deg)}
.pending-btn.on{color:#0642a6;background:var(--cyan);border-color:var(--cyan)}
.pending-btn:hover{border-color:#fff}
/* Days are blue-on-blue horizontal menu choices, not white cards. */
.body-wrap{max-width:920px;margin:0 auto;padding:19px 16px 34px}
.section-caption{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 5px 12px;color:#fff;font:900 italic 25px/1 var(--display);letter-spacing:-.035em}
.section-caption #matchingCount{font:800 normal 11px/1 var(--display);letter-spacing:.1em;color:#bae7ff}
.days{display:grid;grid-template-columns:minmax(0,1fr);gap:9px}
.day{background:#1054c5;border:1px solid #2e8ce8;position:relative;overflow:hidden;contain:layout style;transition:background .16s,border-color .16s}
.day:before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:#57c8ff}
.day.open{background:#115dd3;border-color:#78cfff}
.day.open:before{background:var(--cyan);width:6px}
.day-head{display:flex;align-items:center;gap:14px;padding:13px 15px 13px 18px;text-align:left;width:100%;border:0;background:transparent;color:#fff;min-height:80px}
.day-head:hover{background:#186bdf}
.date-num{display:block;flex:none;width:50px;color:#fff;font:900 italic 43px/1 var(--display);letter-spacing:-.09em;transform:skew(-7deg)}
.date-detail{display:flex;flex-direction:column;min-width:0;flex:1;gap:2px}
.date-detail strong{font-size:15px;color:#fff;font-weight:850;letter-spacing:.015em}
.date-detail small{color:#bfebff;font-size:11px}
.date-caret{font:800 26px/1 var(--display);color:var(--cyan);transition:transform .2s;flex:none}
.day.open .date-caret{transform:rotate(90deg)}
.day-main{padding:0 16px 12px 19px;border-top:1px solid #398be4}
.period-title{display:flex;align-items:center;gap:10px;padding:13px 0 4px;font:900 italic 12px/1 var(--display);letter-spacing:.1em;color:var(--cyan)}
.period-title:after{content:'';height:1px;background:#458fdf;flex:1}
.task{display:flex;align-items:flex-start;gap:11px;position:relative;padding:12px 0 13px;border-bottom:1px solid #3186dc}
.task:last-child{border-bottom:0}
.task-mark{display:grid;place-items:center;flex:none;position:relative;padding:0;margin:0}
.task-mark input{appearance:none;-webkit-appearance:none;position:relative;width:22px;height:22px;flex:none;margin:2px 0 0;border:2px solid #dcf6ff;background:transparent;transform:skew(-9deg);border-radius:0;cursor:pointer}
.task-mark input:hover{background:#ffffff17;border-color:#fff}
.task-mark input:checked{background:#fff;border-color:#fff}
.task-mark input:checked:after{content:'✓';color:#0649bc;position:absolute;left:2px;top:-7px;font:900 23px/1 var(--display);transform:skew(9deg)}
.task-mark input:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.task-details{min-width:0;flex:1}
.task-main{display:flex;align-items:start;gap:7px}
.task-summary{min-width:0;flex:1}
.task-title{font-size:13.5px;line-height:1.57;color:#fff;font-weight:750;word-break:break-word}
.task.checkable.done .task-title{text-decoration:line-through;color:#a9d5f4;text-decoration-color:#a9d5f4}
.task.checkable.done .task-where{opacity:.52}
.task-where{font-size:11px;line-height:1.48;margin-top:3px;color:#b4dff9}
.tag{display:inline-block;font-size:10px;line-height:1.4;padding:1px 5px;margin:0 6px 0 0;border:1px solid #9cecff;color:var(--cyan);font-weight:800;letter-spacing:.02em}
.tag.auto{border-color:transparent;background:#174ea8}
.detail-toggle{flex:none;padding:0px 5px;margin-top:1px;border:0;background:transparent;color:#a1f1ff;font:800 23px/1 var(--display);transition:transform .19s}
.detail-toggle[aria-expanded=true]{transform:rotate(90deg)}
.task-expanded{font-size:12px;color:#f1fbff;line-height:1.57;margin-top:10px;padding:3px 0 3px 11px;border-left:2px solid var(--cyan);animation:reveal .22s ease-out}
.task-expanded[hidden]{display:none}
.task-expanded ol{margin:0;padding-left:17px}
.task-expanded li{padding:0;margin:5px 0}
.task-expanded .choice-lines{margin:5px 0 2px;padding-left:17px;list-style-type:circle;color:#d9f8ff}
.task-expanded .choice-lines li{margin:4px 0;overflow-wrap:anywhere}
.task-info .task-title{font-size:12px;font-weight:600;color:#bce7fe}
.task-info .task-where{font-size:11px}
.task-info.free-line .task-title{font-style:italic}
.task-hint{margin:9px 0 1px;padding:9px 10px;background:#0b439d;border-left:3px solid var(--cyan);color:#dbf8ff;font-size:12px;line-height:1.55}
.extra-note{white-space:pre-line}
.subhead{font-size:11px;color:var(--cyan);font-weight:900;letter-spacing:.035em;margin:11px 0 4px}
.subitem{display:flex;align-items:start;gap:9px;padding:7px 0;border-bottom:1px solid #448bda;cursor:pointer}
.subitem input{flex:none;width:17px;height:17px;margin:2px 0 0;accent-color:#c3f8ff}
.subitem span{color:#f1faff;line-height:1.45}
.subitem input:checked+span{color:#b5defb;text-decoration:line-through}
.event-line,.free-line{padding:10px 1px 7px 2px;color:#bce7fe;font-size:12px;line-height:1.5}
.event-line b{color:var(--cyan);font-weight:850}
.free-line{font-style:italic}
.empty{padding:39px 5px;text-align:center;color:#d4f1ff}
.fineprint{font-size:10.5px;line-height:1.6;margin:8px 5px;padding:18px 0;color:#b7d9f9;text-align:center}
/* Bold white menu strip. No glass, reflections, shadows or gradients. */
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:9px 16px calc(9px + env(safe-area-inset-bottom));background:#062f98;border-top:2px solid #55aaff;display:flex;justify-content:center}
.bottom button{width:100%;max-width:460px;display:flex;align-items:center;justify-content:center;gap:12px;padding:11px 14px;border:0;background:#fff;color:#0a41b3;font-weight:900;font-size:14px;letter-spacing:.02em;transform:skew(-6deg);transition:background .15s,transform .15s}
.bottom button:hover{background:#c7fbff}
.bottom button:active{transform:skew(-6deg) translateY(2px)}
.next-arrow{font:900 23px/1 var(--display)}
/* Modal is also deep blue: the only light area is a selected menu action. */
dialog{border:2px solid #85dfff;border-radius:0;background:#1044b1;color:#fff;padding:0;width:min(calc(100vw - 30px),370px);max-height:80vh;box-shadow:0 14px 0 #002264}
dialog::backdrop{background:#001d63c9}
.dialog-inner{padding:22px 19px}
.dialog-top{display:flex;align-items:start;justify-content:space-between;gap:10px}
.dialog-top h2{font:900 italic 37px/1 var(--display);color:#fff;margin:0;letter-spacing:-.04em}
.close-dialog{background:transparent;border:0;color:#fff;font-size:30px;line-height:1}
.dialog-inner p{font-size:12px;color:#c1e4fd;margin:15px 0 20px}
.dialog-action{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 13px;margin-bottom:8px;border:1px solid #65bff6;background:#0e58ca;color:#fff;text-align:left;font-weight:850}
.dialog-action:hover{background:#fff;color:#093f9c}
.dialog-action span{font-size:18px}
.motion-row{display:flex;align-items:center;gap:10px;margin-top:21px;padding-top:15px;border-top:1px solid #4e9deb;font-size:13px;color:#fff}
.motion-row input{width:18px;height:18px;accent-color:#85edff}
@keyframes reveal{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
@keyframes daySlide{from{opacity:0;transform:translateX(-11px)}to{opacity:1;transform:translateX(0)}}
@keyframes markPulse{50%{transform:skew(-9deg) scale(1.17)}}
@keyframes heroEnter{from{opacity:.3;transform:translate(-14px,7px) skew(-8deg)}to{opacity:1;transform:translate(0,0) skew(-8deg)}}
body:not(.no-motion) .day{animation:daySlide .25s ease-out both}
body:not(.no-motion) .day:nth-child(2){animation-delay:.025s}
body:not(.no-motion) .day:nth-child(3){animation-delay:.05s}
body:not(.no-motion) .day:nth-child(4){animation-delay:.075s}
body:not(.no-motion) .task-mark input:checked{animation:markPulse .26s ease-out}
body:not(.no-motion) .huge-number{animation:heroEnter .4s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){
 .body-wrap{padding:24px 25px 42px}
 .control-inner{padding:14px 25px 17px}
 .days{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:13px}
 .day-main{padding-right:20px}
 .blue-panel-inner{padding:29px 30px 30px;min-height:236px}
 .masthead-inner{padding-left:26px;padding-right:26px}
 .panel-title{margin-top:11px}
}
@media(max-width:400px){
 .masthead-inner{padding:9px 15px;min-height:61px;gap:8px}
 .brand{gap:5px}
 .brand-square{font-size:29px;width:60px}
 .brand-text{font-size:12px}
 .mini-stat{font-size:18px}
 .mini-label{font-size:8px;margin-left:3px}
 .blue-panel-inner{min-height:200px;padding:20px 19px 24px}
 .huge-number{font-size:87px;min-width:120px}
 .panel-right strong{font-size:34px}
 .month-btn{min-width:47px;padding:9px 12px;font-size:21px}
 .body-wrap{padding:17px 13px 26px}
 .day-head{gap:10px;padding-left:14px}
 .day-main{padding-left:16px;padding-right:14px}
 .control-inner{padding:11px 13px 13px}
 .control-row{gap:9px}
 .pending-btn{font-size:11px;padding:9px 9px}
}
@media(max-width:345px){
 .brand-text{display:none}
 .panel-title{gap:12px}
 .huge-number{font-size:78px;min-width:104px}
 .panel-right strong{font-size:29px}
 .date-num{width:44px;font-size:38px}
 .mini-label{display:none}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body.no-motion *,body.no-motion *:before,body.no-motion *:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}

/* Two intentionally P3R-blue palettes: bright ocean and midnight sea. */
:root{--theme-button-border:#72c7fc;--theme-button-bg:#0a48b5}
.theme-toggle{width:auto;min-width:42px;height:35px;display:flex;align-items:center;justify-content:center;gap:7px;padding:1px 9px;border:1px solid var(--theme-button-border);background:var(--theme-button-bg);color:#fff;transform:skew(-8deg);white-space:nowrap;transition:border-color .18s,background .18s,color .18s}
.theme-toggle>span{transform:skew(8deg)}
.theme-icon{font:900 22px/1 var(--display);color:var(--cyan);min-width:18px;text-align:center}
.theme-word{font:900 italic 10px/1 var(--display);letter-spacing:.055em}
.theme-toggle:hover,.theme-toggle:focus-visible{border-color:#fff;background:#166ee4}
.theme-toggle[aria-pressed="true"]{border-color:var(--cyan)}
.theme-toggle[aria-pressed="true"] .theme-icon{color:var(--aqua)}
/* Deep-sea mode is navy and cobalt, never charcoal/black. Cyan navigation survives. */
html[data-theme="night"]{
  --bg:#081c47;--surface:#103777;--surface-active:#154590;
  --surface-deep:#082559;--blue:#1250a0;--deep:#071b45;
  --navy:#061632;--cyan:#81e7ff;--aqua:#bcf6ff;
  --ink:#f5faff;--muted:#b9d8f1;--line:#386eaa;
  --theme-button-bg:#09214f;--theme-button-border:#5288c0;
}
html[data-theme="night"] .masthead{background:#061633;border-bottom-color:#3a659d}
html[data-theme="night"] .blue-panel{background:#10326f}
html[data-theme="night"] .blue-panel:before{background:#18458f;opacity:.7}
html[data-theme="night"] .blue-panel:after{border-color:#5ac5fb;opacity:.17}
html[data-theme="night"] .blue-panel-inner:after{border-color:#80deff;opacity:.07}
html[data-theme="night"] .panel-id,html[data-theme="night"] .panel-progress{color:#ceeafd}
html[data-theme="night"] .panel-right span{color:#b9dcf5}
html[data-theme="night"] .progress-track{background:#325a91}
html[data-theme="night"] .panel-stripe{opacity:.9}
html[data-theme="night"] .control-strip{background:#091f4c;border-top-color:#2c5c9a;border-bottom-color:#28558b}
html[data-theme="night"] .month-btn{color:#94b9dd}
html[data-theme="night"] .month-btn.active{color:#0c2854}
html[data-theme="night"] .month-btn.active:before{background:#e1f8ff}
html[data-theme="night"] .searchbox{border-bottom-color:#75b9e8}
html[data-theme="night"] .search-icon{color:#e5f7ff}
html[data-theme="night"] .searchbox input::placeholder{color:#b2d1ee}
html[data-theme="night"] .pending-btn{border-color:#639fd3;color:#f1faff}
html[data-theme="night"] .pending-btn.on{background:var(--cyan);border-color:var(--cyan);color:#082857}
html[data-theme="night"] .section-caption #matchingCount{color:#b4d6f4}
html[data-theme="night"] .day{background:#10336d;border-color:#336ba6}
html[data-theme="night"] .day.open{background:#154184;border-color:#74bfe9}
html[data-theme="night"] .day:before{background:#4aa6ea}
html[data-theme="night"] .day.open:before{background:var(--cyan)}
html[data-theme="night"] .day-head:hover{background:#1c4c95}
html[data-theme="night"] .day-main{border-top-color:#366fab}
html[data-theme="night"] .period-title:after{background:#4273aa}
html[data-theme="night"] .task{border-bottom-color:#36669d}
html[data-theme="night"] .task-mark input{border-color:#e5f8ff}
html[data-theme="night"] .task-mark input:checked{background:#e6faff;border-color:#e6faff}
html[data-theme="night"] .task-mark input:checked:after{color:#143976}
html[data-theme="night"] .task.checkable.done .task-title{color:#a0c5e1;text-decoration-color:#a0c5e1}
html[data-theme="night"] .task-where{color:#b4d4f1}
html[data-theme="night"] .date-detail small{color:#bee1f9}
html[data-theme="night"] .tag{border-color:#70c7e6}
html[data-theme="night"] .tag.auto{background:#154a8d}
html[data-theme="night"] .detail-toggle{color:#b6f1ff}
html[data-theme="night"] .task-expanded{color:#e7f6ff}
html[data-theme="night"] .task-hint{background:#082858;color:#d0edff}
html[data-theme="night"] .subitem{border-bottom-color:#3d689c}
html[data-theme="night"] .subitem input{accent-color:#8ceeff}
html[data-theme="night"] .event-line,html[data-theme="night"] .free-line{color:#b7d7ef}
html[data-theme="night"] .event-line b{color:#a2e8ff}
html[data-theme="night"] .fineprint{color:#b0cde6}
html[data-theme="night"] .bottom{background:#061736;border-top-color:#427bb2}
html[data-theme="night"] .bottom button{background:#e9faff;color:#103671}
html[data-theme="night"] .bottom button:hover{background:#bdf5ff}
html[data-theme="night"] dialog{background:#0d2f65;border-color:#71bde9;box-shadow:0 12px 0 #03132b}

const byId=new Map(all.map(t=>[t.id,t]));
const dayOf=new Map();blocks.forEach(d=>d.items.forEach(t=>dayOf.set(t.id,d)));
const $=id=>document.getElementById(id);
const OLDKEY='p3r_hunterjia_checklist_v1';
const SUBKEY='p3r_hunterjia_substeps_v2';
const MOTIONKEY='p3r_minimal_motion_v1';
const THEMEKEY='p3r_theme_mode_v1';
const MONTHS={4:'4月',5:'5月',6:'6月',7:'7月',8:'8月',9:'9月',10:'10月',11:'11月',12:'12月',1:'1月',2:'2月',3:'3月'};
const orderedMonths=[...new Set(blocks.map(b=>b.month))];
const PERIODS={'上午':'上午','白天':'白天','午休':'午休','下午':'下午','放学后':'放学后','晚上':'晚上','夜晚':'晚上','深夜':'深夜','当日事项':'当天','未标注':'当天'};
let completed=saved(OLDKEY),subCompleted=saved(SUBKEY);
let active=4,search='',pendingOnly=false,openDays=new Set(),customOpen=false;
function saved(key){try{let d=JSON.parse(localStorage.getItem(key)||'{}');return d&&typeof d==='object'&&!Array.isArray(d)?d:{};}catch{return {};}}
function store(key,obj){try{localStorage.setItem(key,JSON.stringify(obj));}catch{} if(key===OLDKEY||key===SUBKEY)notifyNative();}
const SELECTKEY='p3r_widget_selected_day_v1';
let selectedDate=(()=>{try{return localStorage.getItem(SELECTKEY)||blocks[0].date}catch{return blocks[0].date}})();
function setSelectedDate(date, sync=true){
 if(!blocks.some(d=>d.date===date))return;
 selectedDate=date;
 try{localStorage.setItem(SELECTKEY,date)}catch{}
 if(sync)notifyNative();
}
function notifyNative(){
 if(!window.AndroidBridge || typeof window.AndroidBridge.syncState!=='function')return;
 try{window.AndroidBridge.syncState(JSON.stringify({completed,substeps:subCompleted,selectedDate,theme:document.documentElement.dataset.theme==='night'?'night':'day'}));}catch(e){}
}

function make(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function addText(parent,cls,value,tag='div'){parent.append(make(tag,cls,value));}
function norm(t){return (t||'').toLocaleLowerCase();}
function displayFor(t){
 const meta=displayMetadata[t.id];
 const title=meta?.widgetTitle||t.title;
 const location=(meta?meta.locationLabel:t.where)||'';
 return {
  title,
  location:location.replace(/(^|[\s·→/／、，,；;])学园(?=$|[\s·→/／、，,；;])/g,'$1月光馆学园'),
  bullets:meta&&Array.isArray(meta.appBullets)?meta.appBullets:[t.title,...(t.steps||[])],
  notes:meta&&Array.isArray(meta.extraNotes)?meta.extraNotes:(t.hint?[t.hint]:[]),
  hasDetails:!!meta?.hasDetails
 };
}
function relevant(t,day){if(pendingOnly&&checkable(t)&&completed[t.id])return false;
 if(search){const display=displayFor(t);const hay=norm([day.date,t.title,t.period,t.where||'',...(t.steps||[]),...(t.substeps||[]),t.hint||'',display.title,display.location,...display.bullets,...display.notes].join(' '));if(!hay.includes(search))return false;}
 return true;
}
function monthButton(m){const btn=make('button','month-btn');btn.type='button';btn.dataset.month=String(m);btn.setAttribute('aria-label',String(m)+'月');btn.append(make('span','',String(m).padStart(2,'0')));btn.addEventListener('click',()=>{active=m;setSelectedDate(blocks.find(b=>b.month===m).date);search='';$('search').value='';pendingOnly=false;$('pendingBtn').classList.remove('on');$('pendingBtn').setAttribute('aria-pressed','false');customOpen=false;openDays=new Set();render();window.scrollTo({top:0,behavior:motion()?'smooth':'instant'});});return btn;}
function buildMonths(){const nav=$('months');orderedMonths.forEach(m=>nav.append(monthButton(m)));}
function motion(){return !document.body.classList.contains('no-motion');}
function updateGlobal(){const count=checkTasks.filter(t=>completed[t.id]).length;
 $('topCompleted').textContent=String(count);$('topTotal').textContent=String(checkTasks.length);
 $('progressLabel').textContent=`已完成 ${count} / ${checkTasks.length}`;
 const pct=Math.round(100*count/checkTasks.length);$('progressPct').textContent=pct+'%';$('progressFill').style.width=pct+'%';
}
function updateHeader(){const isGlobal=!!search;
 $('heroNumber').textContent=isGlobal?'∞':String(active).padStart(2,'0');
 $('heroMonth').textContent=isGlobal?'搜索':MONTHS[active];
 $('heroChinese').textContent=isGlobal?'全部日期':'本月任务';
 $('sectionText').textContent=isGlobal?'搜索结果':MONTHS[active]+' · 待办';
 for(const btn of $('months').children){const selected=!isGlobal&&Number(btn.dataset.month)===active;btn.classList.toggle('active',selected);btn.setAttribute('aria-current',selected?'page':'false');if(selected)btn.scrollIntoView({inline:'nearest',block:'nearest',behavior:'instant'});}
}
function taskRow(t){
 const display=displayFor(t),isCheckable=checkable(t);
 const row=make('div','task '+(isCheckable?'checkable'+(completed[t.id]?' done':''):'task-info '+(t.kind==='free'?'free-line':'event-line')));row.dataset.task=t.id;
 if(isCheckable){const lab=make('label','task-mark');const cb=make('input');cb.type='checkbox';cb.dataset.id=t.id;cb.checked=!!completed[t.id];cb.setAttribute('aria-label','完成 '+display.title);lab.append(cb);row.append(lab);}
 const content=make('div','task-details');const topline=make('div','task-main');const txt=make('div','task-summary');
 const title=make('div','task-title');
 if(t.kind==='optional'||t.kind==='review'||t.kind==='conditional')title.append(make('span','tag',t.kind==='optional'?'可选':t.kind==='review'?'待核实':'前置'));
 if(t.kind==='auto')title.append(make('b','','剧情  /  '));
 if(t.kind==='free')title.append(document.createTextNode('— '));
 title.append(document.createTextNode(display.title));txt.append(title);
 if(display.location)txt.append(make('div','task-where',display.location));
 topline.append(txt);
 const substeps=t.substeps||[];
 const needsSteps=display.hasDetails||display.bullets.length>1||display.bullets.some(s=>s!==display.title)||substeps.length>0||display.notes.length>0;
 let detail;
 if(needsSteps){
  const arrow=make('button','detail-toggle','›');arrow.type='button';arrow.setAttribute('aria-expanded','false');arrow.setAttribute('aria-label','展开 '+display.title+' 的步骤');arrow.setAttribute('aria-controls','details-'+t.id);
  topline.append(arrow);
  detail=make('div','task-expanded');detail.id='details-'+t.id;detail.hidden=true;
  if(display.bullets.length){
   const ol=make('ol','app-bullets');let action=null,choices=null;
   for(const s of display.bullets){
    const isChoice=/^(?:选择[：:]|对话选择[：:]|按顺序选|最后一项[：:])/.test(s.trim());
    if(isChoice&&action){if(!choices){choices=make('ul','choice-lines');action.append(choices);}choices.append(make('li','app-bullet choice-line',s));}
    else{action=make('li','app-bullet',s);ol.append(action);choices=null;}
   }
   detail.append(ol);
  }
  if(substeps.length){detail.append(make('div','subhead','位置清单 · 可逐处打卡'));for(let k=0;k<substeps.length;k++){
   const name=t.id+'::'+k,cl=make('label','subitem'),ch=make('input');ch.type='checkbox';ch.dataset.sub=name;ch.dataset.parent=t.id;ch.checked=!!subCompleted[name];cl.append(ch,make('span','',substeps[k]));detail.append(cl);
  }}
  for(const note of display.notes)detail.append(make('div','task-hint extra-note',note));
  arrow.addEventListener('click',()=>{detail.hidden=!detail.hidden;arrow.setAttribute('aria-expanded',String(!detail.hidden));});
 }
 content.append(topline);if(detail)content.append(detail);row.append(content);
 return row;
}
function dateRow(day,items){const a=make('article','day');a.dataset.date=day.date;
 const hd=make('button','day-head');hd.type='button';hd.setAttribute('aria-expanded','false');
 hd.append(make('span','date-num',String(day.day).padStart(2,'0')));
 const desc=make('div','date-detail');const tasks=items.filter(checkable);const done=tasks.filter(t=>completed[t.id]).length;
 desc.append(make('strong','',day.date),make('small','',tasks.length?`${done} / ${tasks.length} 已完成`: '无指定打卡任务'));
 hd.append(desc,make('span','date-caret','›'));
 const main=make('div','day-main');main.hidden=true;
 let prev='';for(const t of items){if(t.period!==prev){const pt=make('div','period-title',PERIODS[t.period]||'当天');main.append(pt);prev=t.period;}main.append(taskRow(t));}
 const setOpen=(open)=>{main.hidden=!open;hd.setAttribute('aria-expanded',String(open));a.classList.toggle('open',open);if(open)openDays.add(day.date);else openDays.delete(day.date);};
 hd.addEventListener('click',()=>{setSelectedDate(day.date);customOpen=true;setOpen(main.hidden);});a.append(hd,main);
 const initOpen=!!search || openDays.has(day.date);
 setOpen(initOpen);
 return a;
}
function render(){updateHeader();updateGlobal();const root=$('days');root.textContent='';
 const visible=blocks.filter(b=>!!search||b.month===active).map(b=>({...b,filtered:b.items.filter(t=>relevant(t,b))})).filter(b=>b.filtered.length);
 if(!customOpen&&!search&&visible.length){const first=visible.find(b=>b.filtered.some(t=>checkable(t)&&!completed[t.id]))||visible[0];openDays.add(first.date);}
 for(const b of visible)root.append(dateRow(b,b.filtered));
 $('matchingCount').textContent='共 '+visible.length+' 天';$('empty').hidden=visible.length>0;
}
function refreshAfterCheck(){if(pendingOnly){render();return;}
 updateGlobal();for(const article of $('days').querySelectorAll('.day')){
  const rows=article.querySelectorAll('.task.checkable');const count=rows.length;
  const done=[...rows].filter(t=>t.classList.contains('done')).length;
  const small=article.querySelector('.date-detail small');if(small)small.textContent=count?`${done} / ${count} 已完成`:'无指定打卡任务';
 }}
function nextTask(){const next=checkTasks.find(t=>!completed[t.id]);if(!next){alert('所有待办事项均已勾选。');return;}
 const day=dayOf.get(next.id);active=day.month;setSelectedDate(day.date);search='';$('search').value='';pendingOnly=false;$('pendingBtn').classList.remove('on');$('pendingBtn').setAttribute('aria-pressed','false');customOpen=true;openDays=new Set([day.date]);render();const row=$('days').querySelector(`[data-task="${CSS.escape(next.id)}"]`);if(row){row.scrollIntoView({behavior:motion()?'smooth':'instant',block:'center'});row.classList.add('focus-task');const toggle=row.querySelector('.detail-toggle');if(toggle&&toggle.getAttribute('aria-expanded')==='false')toggle.click();}
}
function exportProgress(){const data={format:OLDKEY,completed,completedSubsteps:subCompleted,schemaVersion:2,exportedAt:new Date().toISOString()};if(window.AndroidBridge && window.AndroidBridge.exportJson){window.AndroidBridge.exportJson(JSON.stringify(data,null,2));return;}const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=make('a');a.href=url;a.download='P3R_打卡进度.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
async function importProgress(file){if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj||!obj.completed||typeof obj.completed!=='object'||Array.isArray(obj.completed))throw Error('文件里没有打卡记录');if(obj.format && obj.format!==OLDKEY)throw Error('文件格式不兼容');if(!confirm('使用导入文件覆盖当前打卡记录？'))return;
 completed=obj.completed;subCompleted=obj.completedSubsteps||{};
 // Older exports checked a whole exam block; retain compatibility with individually split dates.
 for(const t of all){if(t.originalRef&&completed[t.originalRef]&&completed[t.id]===undefined)completed[t.id]=true;}
 store(OLDKEY,completed);store(SUBKEY,subCompleted);render();$('prefs').close();alert('进度已导入。');}catch(e){alert('导入失败：'+e.message);}}

function initTheme(){
 const isNight=()=>document.documentElement.dataset.theme==='night';
 function sync(){
  const night=isNight();
  $('themeIcon').textContent=night?'☼':'☾';
  $('themeWord').textContent=night?'白天':'夜晚';
  $('themeToggle').setAttribute('aria-pressed',String(night));
  $('themeToggle').setAttribute('aria-label',night?'切换为日间模式':'切换为夜间模式');
  $('themeToggle').title=night?'切换为明亮海蓝':'切换为深海夜蓝';
  const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=night?'#081c47':'#0642b7';
 }
 $('themeToggle').addEventListener('click',()=>{
  const night=!isNight();document.documentElement.dataset.theme=night?'night':'day';
  try{localStorage.setItem(THEMEKEY,night?'night':'day')}catch{}
  sync();notifyNative();
 });
 sync();
}

function init(){
 initTheme();
 buildMonths();
 const prefersReduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 let storedMotion='';try{storedMotion=localStorage.getItem(MOTIONKEY)||'';}catch{}
 const enableMotion=storedMotion?storedMotion==='on':!prefersReduce;
 document.body.classList.toggle('no-motion',!enableMotion);$('motion').checked=enableMotion;
 $('motion').addEventListener('change',e=>{document.body.classList.toggle('no-motion',!e.target.checked);try{localStorage.setItem(MOTIONKEY,e.target.checked?'on':'off');}catch{}});
 $('menuButton').addEventListener('click',()=>$('prefs').showModal());$('closePrefs').addEventListener('click',()=>$('prefs').close());$('prefs').addEventListener('click',e=>{if(e.target===$('prefs'))$('prefs').close();});
 $('search').addEventListener('input',e=>{search=norm(e.target.value.trim());customOpen=false;openDays.clear();render();});
 $('pendingBtn').addEventListener('click',()=>{pendingOnly=!pendingOnly;$('pendingBtn').classList.toggle('on',pendingOnly);$('pendingBtn').setAttribute('aria-pressed',String(pendingOnly));customOpen=false;openDays.clear();render();});
 $('nextTask').addEventListener('click',nextTask);$('export').addEventListener('click',exportProgress);$('import').addEventListener('click',()=>$('fileInput').click());$('fileInput').addEventListener('change',async e=>{await importProgress(e.target.files?.[0]);e.target.value='';});
 $('days').addEventListener('change',e=>{
  const el=e.target;if(el.matches('input[data-id]')){completed[el.dataset.id]=el.checked;store(OLDKEY,completed);el.closest('.task')?.classList.toggle('done',el.checked);refreshAfterCheck();}
  else if(el.matches('input[data-sub]')){subCompleted[el.dataset.sub]=el.checked;store(SUBKEY,subCompleted);const parent=byId.get(el.dataset.parent);if(parent?.substeps?.length){const allDone=parent.substeps.every((_,i)=>!!subCompleted[parent.id+'::'+i]);if(allDone&&!completed[parent.id]){completed[parent.id]=true;store(OLDKEY,completed);const p=el.closest('.task');const cb=p?.querySelector('input[data-id]');if(cb)cb.checked=true;p?.classList.add('done');refreshAfterCheck();}}}
 });
 render();
}

window.P3RNative={
 applyState(state){
  try{
   const obj=typeof state==='string'?JSON.parse(state):state;
   if(!obj || !obj.completed || typeof obj.completed!=='object')return;
   completed=obj.completed;subCompleted=obj.substeps||{};
   try{localStorage.setItem(OLDKEY,JSON.stringify(completed));localStorage.setItem(SUBKEY,JSON.stringify(subCompleted));}catch{}
   if(obj.theme==='night'||obj.theme==='day'){
    document.documentElement.dataset.theme=obj.theme;
    try{localStorage.setItem(THEMEKEY,obj.theme)}catch{}
    const night=obj.theme==='night';
    $('themeIcon').textContent=night?'☼':'☾';$('themeWord').textContent=night?'白天':'夜晚';
    $('themeToggle').setAttribute('aria-pressed',String(night));
    $('themeToggle').setAttribute('aria-label',night?'切换为日间模式':'切换为夜间模式');
    const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=night?'#081c47':'#0642b7';
   }
   if(obj.selectedDate){
    setSelectedDate(obj.selectedDate,false);
    const day=blocks.find(b=>b.date===selectedDate);
    if(day){active=day.month;openDays=new Set([day.date]);customOpen=true;search='';$('search').value='';}
   }
   render();
  }catch(e){console.warn('Unable to apply native state',e)}
 },
 open(date,id){
  const day=blocks.find(b=>b.date===date)||(id?dayOf.get(id):null);
  if(!day){nextTask();return;}
  active=day.month;setSelectedDate(day.date);search='';$('search').value='';pendingOnly=false;
  $('pendingBtn').classList.remove('on');$('pendingBtn').setAttribute('aria-pressed','false');
  customOpen=true;openDays=new Set([day.date]);render();
  requestAnimationFrame(()=>{
   const row=id?document.querySelector('[data-task="'+CSS.escape(id)+'"]'):document.querySelector('.day[data-date="'+CSS.escape(day.date)+'"]');
   if(row){row.scrollIntoView({behavior:motion()?'smooth':'instant',block:'center'});row.classList.add('focus-task');const toggle=row.querySelector('.detail-toggle');if(toggle&&toggle.getAttribute('aria-expanded')==='false')toggle.click();}
  });
 },
 next:nextTask
};

init();
})();
</script></body></html>
